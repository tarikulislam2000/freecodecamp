<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Package Delivery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Package Delivery</h1>
    <p>Log packages as they are delivered to customers</p>
    <div class="actions">
      <button type="button" data-status="delivered">Log package</button>
      <button type="button" data-status="lost" class="lost">Log lost package</button>
    </div>
    <ul id="package-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
